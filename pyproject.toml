[project]
name = "resnet-based-skin-lesion-classification-system"
version = "0.1.0"
description = "Skin lesion image classification using a ResNet-152 backbone (PyTorch/torchvision) with MLflow experiment tracking via DagShub."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Deep learning
    "torch==2.10.0",
    "torchvision==0.25.0",
    # Data handling
    "numpy>=1.26",
    "pandas>=2.0",
    # Visualisation
    "matplotlib>=3.8",
    # ML utilities
    "scikit-learn>=1.4",
    # Config & environment
    "pyyaml>=6.0.3",
    "python-dotenv>=1.0.0",
    # Experiment tracking
    "mlflow>=2.13",
    # Progress bars
    "tqdm>=4.66",
    # API serving
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
    # Web demo
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
