<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skin Lesion Diagnostic AI</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#0f172a',
                        navyMid: '#1e293b',
                        navyLight: '#334155',
                        indigo: '#312e81',
                        teal: '#0d9488',
                        tealLight: '#14b8a6',
                        cyan: '#06b6d4',
                        cyanGlow: '#22d3ee',
                        slate: '#64748b',
                        green: '#10b981',
                        danger: '#ef4444',
                    },
                },
            },
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .bg-gradient-app {
            background: linear-gradient(180deg, #0f172a 0%, #1e1b4b 35%, #134e4a 70%, #0c4a6e 100%);
            min-height: 100vh;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.18);
        }

        .glass-elevated {
            background: rgba(26, 35, 50, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(148, 163, 184, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        .glow-frame {
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.35), 0 0 24px rgba(6, 182, 212, 0.25);
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
        }

        .floating-card {
            background: linear-gradient(135deg, rgba(13, 148, 136, 0.35) 0%, rgba(6, 182, 212, 0.35) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(20, 184, 166, 0.4);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 20px 40px -12px rgba(0, 0, 0, 0.45);
        }

        .circuit-line {
            position: absolute;
            width: 24px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(34, 211, 238, 0.7));
            top: 50%;
            border-radius: 1px;
        }

        .circuit-line.left {
            left: 0;
            transform: translateY(-50%);
            background: linear-gradient(90deg, rgba(34, 211, 238, 0.7), transparent);
        }

        .circuit-line.right {
            right: 0;
            transform: translateY(-50%);
            background: linear-gradient(90deg, transparent, rgba(34, 211, 238, 0.7));
        }

        .btn-cta {
            background: linear-gradient(90deg, rgba(13, 148, 136, 0.9) 0%, rgba(6, 182, 212, 0.9) 100%);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(34, 211, 238, 0.35);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1), 0 10px 30px -8px rgba(6, 182, 212, 0.4);
        }

        .btn-cta:disabled {
            opacity: 0.5;
            filter: grayscale(0.3);
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-pop-in {
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .animate-pop-in-delay {
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.12s forwards;
            opacity: 0;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(16px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .focus-ring:focus-visible {
            outline: 2px solid #06b6d4;
            outline-offset: 2px;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>

<body class="text-white antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef } = React;

        const DISEASE_NAMES = {
            akiec: 'Actinic Keratoses',
            bcc: 'Basal Cell Carcinoma',
            bkl: 'Benign Keratosis',
            df: 'Dermatofibroma',
            mel: 'Melanoma (Cancer)',
            nv: 'Melanocytic Nevi',
            vasc: 'Vascular Lesions',
        };
        const CANCER_CLASSES = ['mel', 'bcc', 'akiec'];

        function formatDiagnosisLabel(shortName) {
            const full = DISEASE_NAMES[shortName] || shortName;
            return shortName + ' (' + full + ')';
        }

        function App() {
            const [file, setFile] = useState(null);
            const [preview, setPreview] = useState(null);
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [error, setError] = useState(null);
            const fileInputRef = useRef(null);

            const handleFileChange = (e) => {
                const selectedFile = e.target.files[0];
                if (selectedFile) {
                    setFile(selectedFile);
                    setPreview(URL.createObjectURL(selectedFile));
                    setResult(null);
                    setError(null);
                }
            };

            const handleDrop = (e) => {
                e.preventDefault();
                const selectedFile = e.dataTransfer.files[0];
                if (selectedFile && selectedFile.type.startsWith('image/')) {
                    setFile(selectedFile);
                    setPreview(URL.createObjectURL(selectedFile));
                    setResult(null);
                    setError(null);
                }
            };

            const handleDragOver = (e) => e.preventDefault();

            const handlePredict = async () => {
                if (!file) return;
                setLoading(true);
                setError(null);
                const formData = new FormData();
                formData.append('file', file);
                try {
                    const response = await fetch('/api/v1/predict', { method: 'POST', body: formData });
                    if (!response.ok) {
                        const err = await response.json();
                        const msg = Array.isArray(err.detail) ? err.detail.map((x) => x.msg || x).join(', ') : (err.detail || 'Failed to predict');
                        throw new Error(msg);
                    }
                    const data = await response.json();
                    setResult(data);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const resetAnalysis = () => {
                setFile(null);
                setPreview(null);
                setResult(null);
                setError(null);
            };

            function Header() {
                return (
                    <header className="flex items-center justify-between px-4 sm:px-6 pt-6 pb-4 animate-pop-in">
                        <button type="button" className="glow-frame w-11 h-11 rounded-xl flex items-center justify-center text-white hover:bg-white/10 transition-colors focus-ring" aria-label="Menu">
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
                        </button>
                        <h1 className="text-lg font-semibold text-white">Diagnostic</h1>
                        <button type="button" className="glow-frame w-11 h-11 rounded-xl flex items-center justify-center text-white hover:bg-white/10 transition-colors focus-ring" aria-label="Info">
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                        </button>
                    </header>
                );
            }

            function HeroUpload() {
                const hasPreview = !!preview;
                return (
                    <section className="px-4 sm:px-6 pt-2 pb-4" aria-labelledby="upload-heading">
                        <h2 id="upload-heading" className="sr-only">Upload image</h2>
                        <label className="block">
                            <span className="sr-only">Choose JPEG or PNG image</span>
                            <div
                                role="button"
                                tabIndex={0}
                                onClick={() => fileInputRef.current?.click()}
                                onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInputRef.current?.click(); } }}
                                onDragOver={handleDragOver}
                                onDrop={handleDrop}
                                className="focus-ring relative min-h-[260px] sm:min-h-[300px] rounded-3xl overflow-hidden glass-panel border border-white/10 flex flex-col items-center justify-center text-center cursor-pointer transition-all duration-300 hover:border-cyan/30"
                            >
                                {hasPreview ? (
                                    <>
                                        <div className="absolute inset-0 flex items-center justify-center bg-navy/60 opacity-0 hover:opacity-100 transition-opacity z-10">
                                            <span className="glass-elevated text-cyan px-5 py-2.5 rounded-xl font-semibold text-sm border border-cyan/30">Change image</span>
                                        </div>
                                        <img src={preview} alt="Preview" className="absolute inset-0 w-full h-full object-contain p-4" />
                                    </>
                                ) : (
                                    <>
                                        <div className="w-20 h-20 rounded-2xl bg-teal/25 flex items-center justify-center text-cyan mb-4 border border-cyan/20">
                                            <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
                                        </div>
                                        <p className="font-semibold text-white">Upload dermoscopic image</p>
                                        <p className="text-sm text-slate-400 mt-1">JPEG or PNG</p>
                                    </>
                                )}
                            </div>
                            <input ref={fileInputRef} type="file" accept="image/jpeg,image/png,image/jpg" onChange={handleFileChange} className="sr-only" aria-label="Choose image file" />
                        </label>
                    </section>
                );
            }

            function FloatingDiagnosisCard() {
                if (error) {
                    return (
                        <div className="mx-4 sm:mx-6 -mt-2 mb-6 animate-fade-in-up">
                            <div className="floating-card rounded-2xl p-4 border-danger/40 bg-red-500/10">
                                <div className="flex gap-3 items-start">
                                    <svg className="w-6 h-6 flex-shrink-0 text-danger mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                    <div className="flex-1 min-w-0">
                                        <p className="font-semibold text-red-200">Error</p>
                                        <p className="text-sm text-red-200/90 mt-0.5">{error}</p>
                                        <button type="button" onClick={() => setError(null)} className="mt-2 text-sm font-medium text-cyan hover:underline focus-ring rounded">Dismiss</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    );
                }
                if (result) {
                    return (
                        <div className="mx-4 sm:mx-6 -mt-2 mb-6 animate-fade-in-up relative">
                            <div className="circuit-line left"></div>
                            <div className="circuit-line right"></div>
                            <div className="floating-card rounded-2xl px-5 py-4 flex items-center gap-4">
                                <div className="w-12 h-12 rounded-xl bg-teal/30 flex items-center justify-center text-cyan border border-cyan/30 flex-shrink-0">
                                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
                                </div>
                                <div className="flex-1 min-w-0">
                                    <p className="font-semibold text-white leading-tight">{formatDiagnosisLabel(result.class_name)}</p>
                                    <p className="text-sm text-cyan/90 mt-0.5">{(result.confidence * 100).toFixed(1)}% confidence</p>
                                </div>
                            </div>
                        </div>
                    );
                }
                if (!loading) {
                    return (
                        <div className="mx-4 sm:mx-6 -mt-2 mb-6 animate-pop-in relative">
                            <div className="circuit-line left"></div>
                            <div className="circuit-line right"></div>
                            <div className="floating-card rounded-2xl px-5 py-4 flex items-center gap-4">
                                <div className="w-12 h-12 rounded-xl bg-teal/20 flex items-center justify-center text-slate-400 flex-shrink-0">
                                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                                </div>
                                <div className="flex-1 min-w-0">
                                    <p className="font-semibold text-white">Diagnosis report</p>
                                    <p className="text-sm text-slate-400 mt-0.5">Upload image and analyze</p>
                                </div>
                            </div>
                        </div>
                    );
                }
                return (
                    <div className="mx-4 sm:mx-6 -mt-2 mb-6 relative">
                        <div className="circuit-line left"></div>
                        <div className="circuit-line right"></div>
                        <div className="floating-card rounded-2xl px-5 py-4 flex items-center gap-4 animate-pulse">
                            <div className="w-12 h-12 rounded-xl bg-navyLight/80 flex-shrink-0"></div>
                            <div className="flex-1 space-y-2">
                                <div className="h-4 bg-navyLight/80 rounded w-3/4"></div>
                                <div className="h-3 bg-navyLight/80 rounded w-1/2"></div>
                            </div>
                        </div>
                    </div>
                );
            }

            function VerdictBadge({ className, confidence }) {
                const isCancer = CANCER_CLASSES.includes(className);
                const band = confidence > 0.85 ? 'High' : confidence > 0.5 ? 'Moderate' : 'Low';
                const verdict = isCancer ? 'Potential cancer detected' : 'Benign / non-cancerous';
                return (
                    <div className={`rounded-xl border p-4 text-center ${isCancer ? 'bg-red-500/15 border-red-500/40 text-red-200' : 'bg-green/15 border-green/40 text-green-200'}`}>
                        <p className="font-semibold text-sm uppercase tracking-wide">{verdict}</p>
                        <p className="text-xs mt-1 opacity-90">Certainty: {band} ({(confidence * 100).toFixed(1)}%)</p>
                    </div>
                );
            }

            function ProbabilityBars({ probabilities }) {
                const sorted = Object.entries(probabilities).sort((a, b) => b[1] - a[1]);
                return (
                    <div className="space-y-3">
                        <h3 className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Probability distribution</h3>
                        <ul className="space-y-2.5" role="list">
                            {sorted.map(([cls, prob], idx) => {
                                const isTop = idx === 0;
                                const isCancer = CANCER_CLASSES.includes(cls);
                                return (
                                    <li key={cls} className="space-y-1.5">
                                        <div className="flex justify-between text-sm">
                                            <span className={isTop ? 'font-semibold text-white' : 'text-slate-300'}>{formatDiagnosisLabel(cls)}</span>
                                            <span className={isTop ? 'font-bold text-cyan' : 'text-slate-400'}>{((prob * 100).toFixed(1))}%</span>
                                        </div>
                                        <div className="w-full bg-navyLight rounded-full h-2 overflow-hidden">
                                            <div className={`h-full rounded-full transition-all duration-500 ${isTop ? (isCancer ? 'bg-danger' : 'bg-teal') : 'bg-slate/50'}`} style={{ width: `${prob * 100}%` }} />
                                        </div>
                                    </li>
                                );
                            })}
                        </ul>
                    </div>
                );
            }

            function DetailsSection() {
                if (!result || loading) return null;
                return (
                    <section className="px-4 sm:px-6 pb-6 space-y-5 animate-fade-in-up">
                        <div>
                            <h2 className="text-xl sm:text-2xl font-bold text-white leading-tight">{formatDiagnosisLabel(result.class_name)}</h2>
                            <p className="text-slate-400 mt-1 text-sm">ResNet-152 classification. For research only.</p>
                        </div>
                        <VerdictBadge className={result.class_name} confidence={result.confidence} />
                        <div className="glass-panel rounded-2xl p-5 border border-white/10">
                            <ProbabilityBars probabilities={result.probabilities} />
                        </div>
                        <div className="text-center pt-2">
                            <button type="button" onClick={resetAnalysis} className="text-sm font-semibold text-cyan hover:text-cyanGlow transition-colors focus-ring rounded py-1 px-2">Start new analysis</button>
                        </div>
                    </section>
                );
            }

            function CtaButton() {
                const hasResult = !!result && !loading;
                return (
                    <div className="px-4 sm:px-6 pb-8 pt-2 animate-pop-in-delay">
                        <button
                            type="button"
                            onClick={hasResult ? resetAnalysis : handlePredict}
                            disabled={!hasResult && (!file || loading)}
                            className="focus-ring btn-cta w-full py-4 px-5 rounded-2xl font-semibold text-white flex items-center justify-between gap-3 transition-all disabled:cursor-not-allowed"
                        >
                            {loading ? (
                                <span className="flex items-center gap-3">
                                    <span className="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center">
                                        <svg className="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" /><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" /></svg>
                                    </span>
                                    <span>Analyzing…</span>
                                </span>
                            ) : hasResult ? (
                                <>
                                    <span className="flex items-center gap-3">
                                        <span className="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center">
                                            <svg className="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                                        </span>
                                        <span>Start new analysis</span>
                                    </span>
                                    <span className="text-white/80 flex gap-0.5"><span>&gt;</span><span>&gt;</span><span>&gt;</span></span>
                                </>
                            ) : (
                                <>
                                    <span className="flex items-center gap-3">
                                        <span className="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center">
                                            <svg className="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                        </span>
                                        <span>Analyze image</span>
                                    </span>
                                    <span className="text-white/80 flex gap-0.5"><span>&gt;</span><span>&gt;</span><span>&gt;</span></span>
                                </>
                            )}
                        </button>
                    </div>
                );
            }

            return (
                <div className="bg-gradient-app min-h-screen flex flex-col">
                    <Header />
                    <HeroUpload />
                    <FloatingDiagnosisCard />
                    <DetailsSection />
                    <CtaButton />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
